eou:
  eodag:
    max_workers: 4
    cop_dataspace:
      auth:
        credentials: &cred
          username: 'gaia.tsf.project@gmail.com'
          password: '' # may be defined also by GAIA_EOU_AUTH_CREDENTIALS_PASSWORD env. variable
  asf:
    auth:
      credentials:
        <<: *cred
sdi:
  db: &sdi_db
    host: 'postgis'
    port: 5432
    dbname: 'geodata'
    user: 'postgres'
    password: 'fevcfQBu3b3CfxFU'
  stac:
    db:
      host: 'pgstacdb'
      port: 5432
      dbname: 'stac'
      user: 'stac'
      password: 'stac'
    url: 'http://stacapi:8000'
  allowed_raster_extensions:
    - '.tif'
    - '.zip'
qcl:
  logger:
    level: DEBUG
    db:
      <<: *sdi_db
      dbname: 'logging'
  asset_checker:
    task_required_types:
      amd:
        - s2
        - insitu
    s2_platforms:
      - sentinel-2a
      - sentinel-2b
      - sentinel-2
    insitu_mime_types:
      - application/x-postgresql
    coverage_threshold: 0.95
  validation_rules:
    in_situ:
      require_unique_id: true
      ph_range: {min: 0, max: 14}
      do_range: {min: 0, max: 20}
      conductivity_range: {min: 0, max: 5000}
      turbidity_range: {min: 0, max: 1000}
      temperature_range: {min: -5, max: 50}
    eo_raster:
      max_null_pixels: 0.02
      min_snr: 30
      require_geo_alignment: true
isu:
  csv_encodings:
    - 'utf-8'
    - 'gbk'
    - 'gb18030'
    - 'latin-1'
  parsers:
    slope:
      filename_indicators:
        - slope
        - gnss
        - insar
        - piezo
        - ground_motion
        - egms
        - displacement
        - deformation
      strong_indicators:
        - displacement
        - velocity
        - def_x
        - def_y
        - def_z
        - pressure
        - pore_water
        - kpa
        - kilopascal
        - pascal
        - piezo
        - inclinometer
        - tilt
        - angle
        - depth
        - dataset
        - celsius
        - deformation
        - insar
        - coherence
        - los
      negative_indicators:
        - ph
        - conductivity
        - turbidity
        - sulfate
    water:
      filename_indicators:
        - water
        - quality
        - sonde
        - hydro
        - chem
        - lab
        - sample
      strong_indicators:
        - ph
        - conductivity
        - ec
        - turbidity
        - do
        - orp
        - sulfate
        - iron
        - fe
        - tds
        - nitrate
        - mg/l
      negative_indicators:
        - displacement
        - velocity
        - inclinometer
        - gnss
storage:
  data_dir: /data/gaia_tsf
dask_parameters:
  silence_logs: 'CRITICAL'
  n_workers: 2
  threads_per_worker: 2
  memory_limit: '8GB'
