version: "3.9"

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fevcfQBu3b3CfxFU
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "6432:5432"
  pgstacdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgstacdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: stac
      POSTGRES_PASSWORD: stac
      POSTGRES_DB: stac
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stac" ]
      interval: 5s
      retries: 5
    ports:
      - "7432:5432"
    volumes:
      - pgstac_data:/var/lib/postgresql/data
      - ../../../subsystems/:/opt/gaia_tsf

  stacapi:
    build:
      context: .
      dockerfile: Dockerfile.stacapi
    container_name: stacapi
    restart: unless-stopped
    depends_on:
      - pgstacdb
    environment:
      # Connect to pgstac
      POSTGRES_USER: stac
      POSTGRES_PASS: stac
      POSTGRES_HOST_READER: pgstacdb
      POSTGRES_HOST_WRITER: pgstacdb
      POSTGRES_PORT: 5432
      POSTGRES_DBNAME: stac
      DATABASE_URL: postgresql://stac:stac@pgstacdb:5432/stac
    ports:
      - "9080:8000"

volumes:
  pgstac_data:
  pgdata:
