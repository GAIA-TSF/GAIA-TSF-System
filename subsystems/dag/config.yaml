# GLOBAL SETTINGS 
global:
  random_seed: 42
  log_level: INFO

  # default spatial reference, Update to actual AOI CRS!!! 
  crs: "EPSG:32755"

  # default resolution (meters)
  target_resolution: 10

  # chunking for large data
  processing:
    use_dask: false
    chunk_size: [256, 256]
    n_workers: 8

# Active configuration consumed by the implemented slope DAG pipelines.
# The generic inputs/feature_engineering/pipelines sections below describe the
# wider architecture but are not the runtime schema of SlopeEDAPipeline.
slope_stability:
  inputs:
    los:
      directory: "inputs/los"
      filename_pattern: "los_*.tif"
  static:
    tsf_mask: "static/tsf_mask.tif"
    # Optional stable area for diagnostics. DPR cumulative LOS is unchanged
    # unless common_mode_correction is explicitly enabled.
    stable_reference:
      file: "tsf_stable.tif"
      common_mode_correction: false
  feature_engineering:
    # Retrospective 2-D products only. Select an explicit historical range
    # before enabling them; never use these as monitoring model inputs.
    summary_window:
      start_date: "2018-01-01"
      end_date: "2020-12-31"
    cumulative_los: false
    displacement_increment: false
    velocity: false
    acceleration: false
    jerk: false
    minimum: true
    maximum: true
    mean: true
    standard_deviation: true
    variance: true
    range: true
    net_displacement: true
    trend: false
    temporal_variance: false
  results:
    eda:
      output_dir: "results/eda"
      histogram_bins: 50
      dpi: 300
      style: "seaborn-v0_8-whitegrid"
      cmap: "viridis"
      # Negative mean LOS is red; zero is white; positive mean LOS is blue.
      mean_heatmap_cmap: "RdBu"
      temporal_mean_ylim: null
      temporal_axis_padding_fraction: 0.30
      temporal_los_percentile: 10.0
      mean_heatmap_limits: null
      std_heatmap_limits: null
      heatmap_padding_fraction: 0.30
      raster_format: "GTiff"
      filenames:
        statistics: "statistics.json"
        temporal_mean_std: "temporal_mean_std.png"
        histogram: "histogram.png"
        boxplot: "temporal_boxplot.png"
        mean_heatmap: "mean_los_heatmap.png"
        std_heatmap: "temporal_std_heatmap.png"
        mean_map: "mean_map.tif"
        std_map: "std_map.tif"
    features:
      output_dir: "results/features"
      raster_format: "GTiff"
      metadata_filename: "metadata.json"
      summary_plots:
        enabled: true
        output_dir: "results/features/plots"
        dpi: 200
        histogram_bins: 50
        robust_percentile: 98.0
        sequential_cmap: "viridis"
        diverging_cmap: "RdBu"
        style: "seaborn-v0_8-whitegrid"
        units:
          temporal_summary_minimum: "mm"
          temporal_summary_maximum: "mm"
          temporal_summary_mean: "mm"
          temporal_summary_standard_deviation: "mm"
          temporal_summary_variance: "mm²"
          temporal_summary_range: "mm"
          net_displacement: "mm"
          temporal_summary_linear_trend: "mm/day"
      filenames:
        temporal_summary_minimum: "temporal_summary_minimum.tif"
        temporal_summary_maximum: "temporal_summary_maximum.tif"
        temporal_summary_mean: "temporal_summary_mean.tif"
        temporal_summary_standard_deviation: "temporal_summary_standard_deviation.tif"
        temporal_summary_variance: "temporal_summary_variance.tif"
        temporal_summary_range: "temporal_summary_range.tif"
        net_displacement: "net_displacement.tif"
        temporal_summary_linear_trend: "temporal_summary_linear_trend.tif"
    temporal_features:
      enabled: true
      output_dir: "results/temporal_features"
      raster_format: "GTiff"
      metadata_filename: "metadata.json"
      summary_plots:
        enabled: true
        output_dir: "results/temporal_features/plots"
        dpi: 200
        lower_percentile: 5.0
        upper_percentile: 95.0
        style: "seaborn-v0_8-whitegrid"
        units:
          cumulative_los: "mm"
          displacement_increment: "mm"
          velocity: "mm/day"
          acceleration: "mm/day²"
          jerk: "mm/day³"
          annual: "dimensionless"
      input_features:
        - cumulative_los
        - displacement_increment
        - velocity
        - acceleration
      current:
        enabled: false
      lag:
        enabled: true
        orders: [1, 2, 3]
      difference:
        enabled: false
        orders: [1, 2]
      rolling_mean:
        enabled: true
        window: 5
      rolling_std:
        enabled: true
        window: 5
      calendar:
        enabled: true
        annual_period_days: 365.2425
        features:
          - annual_sin
          - annual_cos
      smoothing:
        enabled: false
        method: "savgol"
        window: 7
        polyorder: 2
      filenames: {}

# INPUT DEFINITIONS
inputs:
  slope_stability:
    sentinel1:
      data_path: "/inputs/los/"
      data_product: 'LOS'
      # polarization: "VV"
      # orbit: "ASCENDING"
      # apply_orbit_correction: true

    auxiliary:
      aoi_path: "/static/tsf_mask.geojson"

  amd:
    sentinel2:
      data_path: "/data/sentinel2/"
      bands: ["B02", "B03", "B04", "B08"]
      cloud_mask: true

    auxiliary:
      aoi_path: "/data/aoi/aoi.geojson"
      water_mask_path: "/data/masks/water_mask.tif"


# HARMONIZATION
harmonization:
  spatial:
    method: "bilinear"     # nearest | bilinear | cubic
    target_resolution: 10

  temporal:
    enabled: false         # DA_R_02 (disabled for now)
    method: "linear"      # nearest | linear | spline
    max_gap_days: 30


# FEATURE ENGINEERING
feature_engineering:

  slope_stability:
    compute_velocity: true
    compute_acceleration: true
    compute_trend: false

    window_size: 3
    smoothing: false


  amd:
    compute_amd_index: true

    spectral_indices:
      ndvi: false
      ndwi: true
      ndsi: false

    log_transform: false


# PREPROCESSING
preprocessing:

  normalization:
    enabled: false
    method: "zscore"   # minmax | zscore
    per_feature: true

  missing_values:
    enabled: false
    strategy: "median"   # mean | median | drop
    max_nan_ratio: 0.2

  outliers:
    enabled: false
    method: "clip"     # clip | log
    clip_range: [0.01, 0.99]

  categorical:
    enabled: false     # DA_R_08



# MASKING
masking:
  apply_aoi: true
  apply_water_mask: true


# VALIDATION
validation:
  check_spatial_consistency: true
  check_nan_ratio: true
  check_time_gaps: true

  max_nan_ratio: 0.3
  max_time_gap_days: 60


# TENSORIZATION
tensorization:
  output_format: "numpy"   # numpy | torch

  layout: "THWC"           # (T, H, W, C)

  flatten:
      enabled: false
      method: "pixel"        # pixel -> (N_pixels, T, C)



# PIPELINES
pipelines:
  slope_stability:
    enabled: true
    steps:
      - ingestion
      - masking
      - spatial_harmonization
      - feature_engineering
      - preprocessing
      - validation
      - tensorization

  amd:
    enabled: true
    steps:
      - ingestion
      - masking
      - spatial_harmonization
      - feature_engineering
      - preprocessing
      - validation
      - tensorization


# OUTPUT SETTINGS
output:

  save_intermediate: false

  paths:
    features: "/output/features/"
    tensors: "/output/tensors/"

  formats:
    raster: "GTiff"
    tensor: "npy"


# PERFORMANCE SETTINGS
performance:

  use_gpu: true
  mixed_precision: false

  batch_processing:
    enabled: true
    batch_size: 8


# DEBUG
debug:

  verbose: true
  save_debug_tiles: false
  debug_tile_size: [128, 128]

