# GAIA-TSF DAG CONFIG

# Slope stability 
# project_dir: "/Users/lukas/Work/prfuk/ownCloud/Projects/GAIA_TSF/tsf_experiments/synthetic_tsf_deformation/"
# no_failure, gradual_acceleration, spatial_propagation, external_trigger
project_dir: '/home/lukas/ownCloud/Projects/GAIA_TSF/tsf_experiments/slope_synthetic_western_platinum_external_trigger/'


# AMD 
# project_dir: '/home/lukas/ownCloud/Projects/GAIA_TSF/tsf_experiments/slope_synthetic_western_platinum_spatial_propagation/'
# project_dir: '/home/lukas/ownCloud/Projects/GAIA_TSF/tsf_experiments/amd_yxsjoberg_2018_2022/'

# GLOBAL SETTINGS 
global:
  random_seed: 42
  log_level: INFO

  # default spatial reference, Update to actual AOI CRS!!! 
  crs: "EPSG:32633"

  # default resolution (meters)
  target_resolution: 10

  # chunking for large data
  processing:
    use_dask: false
    chunk_size: [256, 256]
    n_workers: 16

# SYNTHETIC IN-SITU CO-LOCATION (DA_R_02, DA_R_03)
in_situ:
  inputs:
    directory: "inputs/true_los"
    filename_pattern: "*.tif"
  static:
    observation_points: "static/observation_points.gpkg"
    # Attribute currently used in the GeoPackage (spelling retained).
    label_column: "label"
  sampling:
    # Nodata-aware square mean around each point; must be a positive odd value.
    window_size: 3
    sensor_noise_std_mm: 1.0
  output_csv: "inputs/in_situ_deformation.csv"
  platform: "OFFICE_REVIEW"
  qc: 0
  validation:
    insar_directory: "inputs/los"
    filename_pattern: "tsf_los_*.tif"
    # Nodata-aware InSAR pixel window centred on each in-situ location.
    sampling_window_size: 3
    # Both raster series are stored in metres; validation output uses mm.
    unit_scale: 1000.0
    output_csv: "results/validation/insar_insitu_colocation.csv"
    statistics_json: "results/validation/insar_insitu_statistics.json"


# DAG PROCESS SETTINGS (DA_R_01)
# Contextual DEM/slope/PI features contribute to DA_R_04.
static_topography:
  dem: "static/tsf_dem.tif"
  # PI is elevation minus the mean elevation in this local pixel window.
  pi_window_size: 3
  results:
    output_dir: "results/static_features"
    raster_format: "GTiff"
    metadata_filename: "metadata.json"
    filenames:
      dem: "dem.tif"
      slope: "slope.tif"
      pi: "pi.tif"

# Sentinel-1 model-ready deformation features (DA_R_01).
slope_stability: 
  inputs:
    los:
      directory: "inputs/los"
      filename_pattern: "tsf_los_*.tif"
  static:
    tsf_mask: "static/tsf_mask.tif"

  feature_engineering:
    cumulative_displacement: true
    velocity: true
    acceleration: true
    jerk: true
    minimum: true
    maximum: true
    mean: true
    standard_deviation: true
    variance: true
    range: true
    trend: false
    temporal_variance: false

  results:
    eda: # slope stability EDA 
      output_dir: "results/eda"
      histogram_bins: 50
      dpi: 300
      style: "seaborn-v0_8-whitegrid"
      cmap: "viridis"
      # Derive temporal axes and heatmap color ranges from finite min/max, then
      # add 30% of the range at each end. Standard-deviation lower limits are
      # clamped to zero. LOS values are stored in metres.
      temporal_mean_ylim: null # Fixed override example: [-0.05, 0.05]
      temporal_std_ylim: null  # Fixed override example: [0.0, 0.002]
      temporal_axis_padding_fraction: 0.30
      # Location-agnostic lower tail; useful for localized negative deformation.
      # It does not use the hidden failure ROI or future observation points.
      temporal_los_percentile: 2.0
      mean_heatmap_limits: null # Fixed override example: [-0.02, 0.01]
      std_heatmap_limits: null  # Fixed override example: [0.0, 0.03]
      heatmap_padding_fraction: 0.30
      raster_format: "GTiff"
      filenames:
        statistics: "statistics.json"
        temporal_mean_std: "temporal_mean_std.png"
        histogram: "histogram.png"
        boxplot: "boxplot.png"
        mean_heatmap: "mean_los_heatmap.png"
        std_heatmap: "temporal_std_heatmap.png"
        mean_map: "mean_map.tif"
        std_map: "std_map.tif"

    features: # slope global features 
      output_dir: "results/features"
      raster_format: "GTiff"
      metadata_filename: "metadata.json"
      filenames:
        cumulative_displacement: "cumulative_displacement.tif"
        velocity: "velocity.tif"
        acceleration: "acceleration.tif"
        jerk: "jerk.tif"
        minimum: "minimum.tif"
        maximum: "maximum.tif"
        mean: "mean.tif"
        standard_deviation: "std.tif"
        variance: "variance.tif"
        range: "range.tif"
        trend: "trend.tif"
        temporal_variance: "temporal_variance.tif"

    temporal_features: # slope temporal features 
      enabled: true
      output_dir: "results/temporal_features"
      raster_format: "GTiff"
      metadata_filename: "metadata.json"
      input_features:
        - velocity
        - acceleration
      lag:
        enabled: true
        orders: [1, 2, 3]
      difference:
        enabled: true
        orders: [1, 2]
      rolling_mean:
        enabled: true
        window: 5
      rolling_std:
        enabled: true
        window: 5
      calendar:
        # Date-only, causal annual seasonality terms for MAP temporal models.
        enabled: true
        annual_period_days: 365.2425
        features:
          - annual_sin
          - annual_cos
      smoothing:
        enabled: true
        method: "savgol"
        window: 7
        polyorder: 2
      filenames: {}

# METEOROLOGICAL FEATURES (DA_R_01, DA_R_02)
meteorology:
  inputs:
    insar:
      directory: "inputs/los"
      filename_pattern: "tsf_los_*.tif"
    table:
      path: "inputs/meteodata.csv"
      date_column: "date"
      columns:
        precipitation: "precipitation"
        temperature_mean: "temperature_mean"
        temperature_min: "temperature_min"
        temperature_max: "temperature_max"
  static:
    tsf_mask: "static/tsf_mask.tif"
  feature_engineering:
    precipitation: true
    precip_7d: true
    precip_14d: true
    precip_30d: true
    precip_60d: true
    days_since_heavy_rain: true
    max_precip_7d: true
    temperature_mean: true
    temperature_min: true
    temperature_max: true
    temp_7d_mean: true
    temp_30d_mean: true
    temperature_anomaly: true
    heavy_rain_threshold: 20.0
    cold_regions:
      enabled: false
    freezing_point: 0.0
  results:
    output_dir: "results/meteo_features"
    raster_format: "GTiff"
    metadata_filename: "metadata.json"
    filenames: {}

# AMD INDEX (DA_R_01)
amd:
  inputs:
    sentinel2:
      directory: "inputs/sentinel2"
      filename_pattern: "*.jp2"
      start_date: "2018-01-01"
      end_date: "2022-12-31"
      band_positions:
        B01: 1
        B02: 2
        B03: 3
        B04: 4
        B05: 5
        B06: 6
        B07: 7
        B08: 8
        B8A: 9
        B09: 10
        B11: 11
        B12: 12
        SCL: 13
  static:
    # aligned mask with not rounded corners to avoid artifacts in the AMD index 
    amd_mask: "static/amd_mask_aligned.tif"
    clean_water_mask: "static/clean_water_mask_aligned.tif"
    amd_point: "static/amd_water_point.gpkg"
    clean_water_point: "static/clean_water_point.gpkg"
  feature_engineering:
    method: difference
    first_band: B04
    second_band: B02
    scale: 1.0
    offset: 0.0
    denominator_epsilon: 0.0
  quality:
    scl_band: SCL
    excluded_scl_classes: [0, 1, 3, 8, 9, 10, 11]
    acquisition_cloud_filter:
      enabled: true
      # Zero keeps only acquisitions with no cloud/shadow pixels in either mask.
      maximum_cloudy_pixels: 0
      cloudy_scl_classes: [3, 8, 9, 10]
    # Exclude pixels this many pixels beyond SCL cloud/shadow/no-data classes.
    cloud_edge_buffer_pixels: 2
    clean_water_variability:
      enabled: true
      threshold_sigma: 3.0
      minimum_valid_pixels: 10
    spatial_inconsistency:
      enabled: true
      window_size: 3
      threshold_sigma: 3.0
      minimum_valid_neighbors: 3
      minimum_reference_pixels: 10
  points:
    window_size: 1
    label_column: label
  acquisitions:
    min_valid_fraction: 0.0
  temporal_features:
    lag_orders: [1, 2, 3]
    difference_orders: [1, 2, 3]
    rolling_window: 5
    min_periods: 5
    calendar_features: [annual_sin, annual_cos]
  trend_analysis:
    enabled: true
    method: robust_lowess
    max_gap_days: 30
    require_same_year: true
    window_days: 20
    robust_iterations: 2
    interpolated_weight: 0.5
    process_each_year: true
  meteorology:
    inputs:
      table:
        path: inputs/meteodata.csv
        date_column: date
        columns:
          precipitation: precipitation
          temperature_mean: temperature_mean
          temperature_min: temperature_min
          temperature_max: temperature_max
    feature_engineering:
      precipitation: true
      precip_7d: true
      precip_14d: true
      precip_30d: true
      precip_60d: true
      days_since_heavy_rain: true
      max_precip_7d: true
      temperature_mean: true
      temperature_min: true
      temperature_max: true
      temp_7d_mean: true
      temp_30d_mean: true
      # Enable with a configured or training-fitted temperature_baseline.
      temperature_anomaly: false
      heavy_rain_threshold: 20.0
      cold_regions:
        enabled: false
  results:
    index:
      output_dir: "results/eda/source_index"
    features:
      output_dir: "results/features"
    temporal_features:
      output_dir: "results/temporal_features"
    meteorology:
      output_dir: "results/meteo_features"
    trend_features:
      output_dir: "results/trend_features"
    eda:
      output_dir: "results/eda"

# PREPROCESSING (DA_R_05, DA_R_09, DA_R_10)
preprocessing:

  normalization:
    # DA_R_05. Disabled by default; supports minmax and zscore when enabled.
    enabled: false
    method: "zscore"   # minmax | zscore
    per_feature: true

  missing_values:
    # DA_R_09. Disabled by default; impute or drop incomplete samples when enabled.
    enabled: false
    strategy: "median"   # mean | median | drop
    max_nan_ratio: 0.2

  outliers:
    # DA_R_10. Disabled by default. Empty feature list applies to every feature.
    enabled: false
    method: "log"      # log | clip
    features: []
    # Signed log1p supports both positive and negative deformation values.
    signed_log: true
    clip_range: [0.01, 0.99]

  categorical:
    enabled: false     # DA_R_08


# HARMONIZATION (DA_R_02, DA_R_06)
# Generic harmonization remains disabled; individual pipelines enforce aligned
# grids and meteorological/InSAR acquisition-date alignment.
harmonization:

  spatial:
    method: "bilinear"     # nearest | bilinear | cubic
    target_resolution: 10

  temporal:
    enabled: false         # DA_R_02 (disabled for now)
    method: "linear"      # nearest | linear | spline
    max_gap_days: 30


# MASKING (DA_R_06)
masking:
  apply_aoi: true
  apply_water_mask: true


# VALIDATION (DA_R_01, DA_R_06)
validation:

  check_spatial_consistency: true
  check_nan_ratio: true
  check_time_gaps: true

  max_nan_ratio: 0.3
  max_time_gap_days: 60
