# Engine B: three-level residual monitoring, moved from the MAP prototype
# (subsystems/map/monitoring at f11c5f2 + stash@{0}). Values are the prototype's.
# The golden regression test checks that these sections equal the prototype's
# configuration (tests/golden/synthetic_crop/config.yaml).

# Residual quantity from the contract: mm_per_day (prototype design) | mm.
residual_quantity: mm_per_day

# frozen_sigma : z = r / sigma_cal, no demeaning      (prototype, f11c5f2 + stash)
# legacy_global: z = (r - mean(all r)) / std(all r)   (950702d; uses monitoring
#                data, so earlier z change when acquisitions are appended)
zscore_formula: frozen_sigma

level1:                           # prototype anomaly_detection
  zscore_threshold: 1.5
  direction: negative             # both | positive | negative
  persistence: 3

legacy_global:                    # 950702d anomaly_detection (zscore_formula: legacy_global)
  residual_threshold: 0.1         # mm/day
  zscore_threshold: 1.5
  direction: negative
  persistence: 3
  combination_operator: or

level2:
  reference_value: 0.5            # k, sigma units
  decision_threshold: 5.0         # h
  direction: null                 # null = level1.direction
  bias_warning_ratio: 0.25

level3:
  watch_threshold: 0.4
  alert_threshold: 0.7
  consecutive_acquisitions: 2

quality:
  minimum_coverage: 0.5
  minimum_calibration_samples: 20

spatial_coherence:                # regional evidence inside L1/L2/L3
  enabled: true
  minimum_area_pixels: 25
  persistence: 3
  minimum_overlap: 0.30
  connectivity: 8

anomaly_magnitude_threshold: 0.1  # mm/day

acceleration_cusum:               # supporting evidence (velocity acceleration)
  instability_direction: negative
  signal: observed_velocity
  spatial_aggregation: directional_tail_mean
  spatial_quantile: 0.05
  reference_value: 0.5
  decision_threshold: 3.0
  derivative_window: 3
  smoothing_span: 3
  persistence_window: 10
  persistence_threshold: 0.25

regime:
  signal: unexpected_acceleration
  smoothing_span: 3

calibration:
  # per_pixel | pooled. Pooled is the default: the synthetic site has only
  # 10 independent calibration dates (plan P3). Used from B2.2 on.
  mode: pooled
  # Which records estimate mu/sigma: prototype = every pre-monitoring record
  # (includes model-training dates); independent = split == calibration (B2.2).
  population: prototype
