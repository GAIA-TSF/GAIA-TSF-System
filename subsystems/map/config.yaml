# Scenario 1: slope-stability baseline behaviour modelling.
# Paths target the configured synthetic TSF project directly.
experiment:
  name: slope_trf # slope_constant_baseline | slope_trf 
  description: Stable-pixel temporal Random Forest for synthetic TSF deformation monitoring
  seed: 42

variable: slope
model: trf # constant | trf 
dataset: slope_dataset

data:
  features_directory: /home/lukas/ownCloud/Projects/GAIA_TSF/tsf_experiments/synthetic_tsf_deformation/results/features
  temporal_features_directory: /home/lukas/ownCloud/Projects/GAIA_TSF/tsf_experiments/synthetic_tsf_deformation/results/temporal_features

outputs:
  root: /home/lukas/ownCloud/Projects/GAIA_TSF/tsf_experiments/synthetic_tsf_deformation/results
  # Model artifacts are stored in models/<experiment.name>/.

variables:
  slope:
    description: Slope stability from InSAR deformation
  amd:
    description: Acid Mine Drainage index from Sentinel-2

# Names are DAG output stems, not MAP-derived features.  The default reflects
# slope_temporal_feature_pipeline outputs and can be changed without code edits.
datasets:
  slope_dataset:
    mask_path: /home/lukas/ownCloud/Projects/GAIA_TSF/tsf_experiments/synthetic_tsf_deformation/static/tsf_mask.tif
    features:
      # Predict velocity_lag1 from earlier temporal states only.
      # [velocity_lag2, velocity_lag3, acceleration_lag1, acceleration_lag2]
      - velocity_lag2
      - velocity_lag3
      - acceleration_lag1
      - acceleration_lag2
    target_feature: velocity_lag1
    split:
      method: temporal
      train_ratio: 0.5
      validation_ratio: 0.25
      test_ratio: 0.25
    temporal_windows:
      calibration:
        start_date: '2018-01-01'
        end_date: '2020-03-27'
      monitoring:
        start_date: '2020-04-01'
        end_date: '2020-10-30'
  amd_dataset:
    mask_path: /home/lukas/ownCloud/Projects/GAIA_TSF/tsf_experiments/synthetic_tsf_deformation/static/tsf_mask.tif
    features: [amd_lag1]
    target_feature: amd
    split:
      method: temporal
      train_ratio: 0.90
      validation_ratio: 0.15
      test_ratio: 0.15
    temporal_windows:
      calibration:
        start_date: '2018-01-01'
        end_date: '2020-01-27'
      monitoring:
        start_date: '2020-02-08'
        end_date: '2020-12-28'

baseline_model:
  stable_pixel_std_threshold: 0.008

models:
  constant:
    statistic: mean
  rf:
    n_estimators: 200
    max_depth: 100
    random_state: 42
  trf:
    n_estimators: 200
    max_depth: 20
    random_state: 42
    n_jobs: 6
  gbr:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
  lstm:
    hidden_size: 64
    num_layers: 2
  tcn: {}

# Modelling results  
# results/models/
# ├── slope_constant_baseline/
# │   ├── model.pkl
# │   ├── metrics.json
# │   └── experiment.json
# └── slope_trf/
#     ├── model.pkl
#     ├── metrics.json
#     └── experiment.json


training:
  random_seed: 42

plotting:
  deformation_unit: mm/day
  value_scale: 1000.0
  cumulative_displacement_unit: mm
  fallback_interval_days: 30.0
  cumulative_observation_max_points: 100000
  observation_window_size: 3
  latest_residual_colormap: RdBu # _r
  latest_residual_percentile: 98.0
  latest_residual_window: 10
  mean_residual_colormap: RdBu # _r
  mean_residual_percentile: 98.0
  persistent_residual_colormap: magma
  persistent_fraction_gamma: 0.35
  # Coordinates use the CRS of tsf_mask.tif (EPSG:32633 for this synthetic TSF).
  observation_points:
    stable_tsf:
      coordinates: [500255.0, 6699495.0]
    deformation_zone:
      coordinates: [500755.0, 6699595.0]

anomaly_detection:
  residual_threshold: 0.02
  zscore_threshold: 2.0
  persistence: 3
