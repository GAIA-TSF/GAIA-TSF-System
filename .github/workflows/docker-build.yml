name: Docker Build CI/CD

on:
  push:
    branches: [ "develop", "feature/build-docker-worflow" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'

  pull_request:
    branches: [ "develop" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'

jobs:
  docker:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build images
        run: docker compose build

      - name: Push images (only for push)
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin; docker compose push
