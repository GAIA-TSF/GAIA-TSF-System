name: pytest

on:
  push:
    branches:
      - develop
    paths:
      - 'subsystems/**'
      - 'docker/**'
      - '.github/workflows/pytest.yml'
      - "!**.md"
  pull_request:
    paths:
      - 'subsystems/**'
      - 'docker/**'
      - '.github/workflows/pytest.yml'
      - "!**.md"

jobs:
  ale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build docker
        run: |
          cd docker
          docker compose up --detach

      - name: Run ALE test suite
        run: |
          cd subsystems
          for i in $(ls ale/tests/test*py); do
            echo "*** running test suite: $i ***"
            cd ../docker
            docker compose run pgstacdb python3 -m pytest -v $i
          done

