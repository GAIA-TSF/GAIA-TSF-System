name: pytest

on:
  push:
    branches:
      - develop
    paths:
      - 'subsystems/**'
      - 'docker/**'
      - '.github/workflows/pytest.yml'
      - "!**.md"
  pull_request:
    paths:
      - 'subsystems/**'
      - 'docker/**'
      - '.github/workflows/pytest.yml'
      - "!**.md"

jobs:
  ale:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Build docker
        run: |
          cd docker
          docker compose up --build --detach

      - name: Run EOU test suite
        run: |
          for i in $(docker exec pgstacdb sh -c "ls ale/tests/*py"); do
            echo "*** running test suite: $i ***"
            docker exec pgstacdb python3 -m pytest -v $i
          done

