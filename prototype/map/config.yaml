# MAP CONFIGURATION 

# GLOBAL EXPERIMENT CONFIGURATION
experiment:
  name: "amd_gbr_baseline"
  description: "AMD monitoring using Gradient Boosting"
  seed: 42

# ACTIVE SETUP (used by pipeline)
variable: amd          # active variable plugin
model: gbr             # active model plugin
feature_pipeline: temporal

dataset: amd_dataset
training: default_training
monitoring: default_monitoring


# VARIABLES (PLUGIN DEFINITIONS)
variables:
  slope:
    description: "Slope stability from InSAR displacement"
    preprocessing:
      detrend: false
      normalize: true

    allowed_models:
      - lstm
      - rf
    default_feature_pipeline: temporal

  amd:
    description: "Acid Mine Drainage index from Sentinel-2"

    preprocessing:
      gap_fill: true
      smoothing: true
      method_gap_fill: linear
      method_smoothing: savgol

    allowed_models:
      - gbr
      - rf

    default_feature_pipeline: temporal


# FEATURE PIPELINES
features:

  temporal:
    description: "Sliding window temporal features"

    look_back: 12
    horizon: 1

    engineered_features:
      - mean
      - std
      - trend
      - slope
      - acceleration

  lagged:
    description: "Lag-based features"

    lags: [1, 2, 3, 6, 12]


# MODELS (PLUGIN CONFIGURATION)
models:

  lstm:
    type: sequence

    hidden_size: 64
    num_layers: 2
    dropout: 0.2

    optimizer:
      lr: 0.001

    training:
      batch_size: 32
      epochs: 50

  rf:
    type: tabular

    n_estimators: 200
    max_depth: 10
    random_state: 42

  gbr:
    type: tabular

    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3


# DATASETS
datasets:

  slope_dataset:
    source: "InSAR displacement"
    temporal_resolution: "monthly"

    split:
      method: temporal
      train_ratio: 0.7
      val_ratio: 0.15
      test_ratio: 0.15

  amd_dataset:
    source: "Sentinel-2 AMD index"
    temporal_resolution: "monthly"

    split:
      method: temporal
      train_ratio: 0.7
      val_ratio: 0.15
      test_ratio: 0.15

### 
# PIPELINES 
pipelines:
  learning:
    dag:
      nodes:
        load:
          op: tensor_loader
          inputs: [input]
        split:
          op: splitter
          inputs: [load]
        window:
          op: windowing
          inputs: [split]
        features:
          op: feature_engineering
          inputs: [window]
        train:
          op: trainer
          inputs: [features]
        validate:
          op: validation
          inputs: [train]
      output: train

pipelines:
  inference:
    dag:
      nodes:
        load:
          op: tensor_loader
          inputs: [input]
        features:
          op: feature_engineering
          inputs: [load]
        predict:
          op: predictor
          inputs: [features]
        trend:
          op: trend_detection
          inputs: [predict]
        anomaly:
          op: anomaly_detection
          inputs: [predict]
        risk:
          op: risk_scoring
          inputs: [trend, anomaly]
      output: risk
### 

### --- OLD --- ### 
# TRAINING / VALIDATION
training:
  default_training:
    validation:
      method: expanding_window   # time-series CV
      folds: 5

    early_stopping:
      enabled: true
      patience: 10

    metrics:
      - rmse
      - mae


# MONITORING (PHYSICS-INFORMED LAYER)
monitoring:

  default_monitoring:

    methods:
      - cusum
      - bayesian_cp
      - regime

    cusum:
      k: 0.5
      h: 5

    bayesian_cp:
      hazard: 0.01

    regime:
      thresholds:
        acceleration: 0.1
        deceleration: -0.1

    residuals:
      standardize: true
      window: 12


# LOGGING / REPRODUCIBILITY
logging:

  save_model: true
  save_config: true
  log_metrics: true



